name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Delete git history and frontend files
          rm -rf .git
          rm -rf frontend
          
          # Initialize a new, clean repository
          git init -b main
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Stage and commit remaining backend files
          git add .
          git commit -m "deploy: clean backend deployment"
          
          # Force push to Hugging Face
          git push --force https://MoZI1223:$HF_TOKEN@huggingface.co/spaces/MoZI1223/Ahmad_Mustafa_Iqbal_Portfolio main
