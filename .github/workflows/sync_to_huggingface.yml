name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git rm -rf frontend
          git commit -m "chore: remove frontend directory for Hugging Face deployment"
          git push --force https://MoZI1223:$HF_TOKEN@huggingface.co/spaces/MoZI1223/Ahmad_Mustafa_Iqbal_Portfolio HEAD:main
